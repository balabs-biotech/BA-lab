name: BAL-JSON import UI contract

on:
  pull_request:
    paths:
      - "batch-tracker/bal-json-import.js"
      - "scripts/test-bal-json-import-ui.mjs"
      - ".github/workflows/bal-json-import-ui.yml"
  push:
    branches: ["feat/bal-json-contract-v1"]
    paths:
      - "batch-tracker/bal-json-import.js"
      - "scripts/test-bal-json-import-ui.mjs"
      - ".github/workflows/bal-json-import-ui.yml"

permissions:
  contents: read

jobs:
  bal-json-import-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test BAL-JSON import preview and authenticated submission
        run: node scripts/test-bal-json-import-ui.mjs
