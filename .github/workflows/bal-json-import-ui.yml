name: BAL-JSON import UI contract

on:
  pull_request:
    paths:
      - "batch-tracker/bal-json-import.js"
      - "batch-tracker/workspace.html"
      - "batch-tracker/tracker.js"
      - "batch-tracker/tracker.css"
      - "batch-tracker/mycology/index.html"
      - "batch-tracker/laboratory/index.html"
      - "supabase/functions/bal-json-ingest/**"
      - "schemas/bal-json/**"
      - "scripts/test-bal-json-import-ui.mjs"
      - "scripts/test-bal-json-contract.mjs"
      - "scripts/test-bal-normalizer.mjs"
      - "scripts/test-biological-interpreter.mjs"
      - "scripts/test-biological-rule-registry.mjs"
      - "supabase/tests/bal-json-ingest-contract.test.mjs"
      - "supabase/migrations/20261111160000_add_bal_json_atomic_ingestion.sql"
      - "shared/**"
      - ".github/workflows/bal-json-import-ui.yml"
  push:
    branches: ["feat/bal-json-contract-v1"]
    paths:
      - "batch-tracker/bal-json-import.js"
      - "batch-tracker/workspace.html"
      - "batch-tracker/tracker.js"
      - "batch-tracker/tracker.css"
      - "batch-tracker/mycology/index.html"
      - "batch-tracker/laboratory/index.html"
      - "supabase/functions/bal-json-ingest/**"
      - "schemas/bal-json/**"
      - "scripts/test-bal-json-import-ui.mjs"
      - "scripts/test-bal-json-contract.mjs"
      - "scripts/test-bal-normalizer.mjs"
      - "scripts/test-biological-interpreter.mjs"
      - "scripts/test-biological-rule-registry.mjs"
      - "supabase/tests/bal-json-ingest-contract.test.mjs"
      - "supabase/migrations/20261111160000_add_bal_json_atomic_ingestion.sql"
      - "shared/**"
      - ".github/workflows/bal-json-import-ui.yml"

permissions:
  contents: read

jobs:
  bal-json-import-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned BAL-JSON schema validator
        run: npm install --no-save --package-lock=false ajv@8.17.1 ajv-formats@3.0.1
      - name: Validate BAL-JSON v1 schemas and fixtures
        run: node scripts/test-bal-json-contract.mjs
      - name: Test BAL-JSON import preview and authenticated submission
        run: node scripts/test-bal-json-import-ui.mjs
      - name: Test conservative BAL-Normalizer rules
        run: node scripts/test-bal-normalizer.mjs
      - name: Test biological rule registry validation and review gate
        run: node scripts/test-biological-rule-registry.mjs
      - name: Test explicit-rule Biological Interpreter
        run: node scripts/test-biological-interpreter.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated BAL-JSON Edge Function
        run: deno check supabase/functions/bal-json-ingest/index.ts
