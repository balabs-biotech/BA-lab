name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-secrets.sh

  firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host-side logic tests and syntax check
        run: sh firmware/test/run_tests.sh

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build both nodes
        run: cd firmware && pio run
