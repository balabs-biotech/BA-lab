name: CultureOps browser smoke

on:
  pull_request:
    paths:
      - "batch-tracker/**"
      - "scripts/test-cultureops-browser.mjs"
      - ".github/workflows/cultureops-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Serve CultureOps
        run: |
          python3 -m http.server 8787 --directory . > /tmp/cultureops-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/batch-tracker/green-tech/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cultureops-http.log
          exit 1
      - name: Test all workspaces on desktop and mobile
        run: node scripts/test-cultureops-browser.mjs
        env:
          CULTUREOPS_BASE_URL: http://127.0.0.1:8787
      - name: Upload CultureOps screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultureops-browser-smoke
          path: artifacts/cultureops-browser-smoke/
          if-no-files-found: warn
          retention-days: 14
