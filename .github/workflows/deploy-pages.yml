name: Deploy Batch Tracker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'batch-tracker/**'
      - 'ecosystem/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/batch-tracker _site/ecosystem
          cp index.html _site/index.html
          cp -R batch-tracker/. _site/batch-tracker/
          cp -R ecosystem/. _site/ecosystem/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
