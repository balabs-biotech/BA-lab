name: Deploy BA Labs website and Batch Tracker to GitHub Pages

# GitHub Pages is the sole public deployment target for this repository.
# Let an active deployment finish; newer pushes supersede the pending run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/batch-tracker _site/ecosystem _site/ecosystem-preview _site/store
          cp index.html _site/index.html
          cp -R batch-tracker/. _site/batch-tracker/
          cp -R ecosystem/. _site/ecosystem/
          cp -R ecosystem-preview/. _site/ecosystem-preview/
          cp -R store/. _site/store/
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" _site/store/index.html
          node scripts/test-storefront.mjs
          node scripts/test-store-order-contract.mjs
          node scripts/test-store-catalogue-contract.mjs
          touch _site/.nojekyll

      - name: Install image optimization dependency
        run: python -m pip install Pillow

      - name: Download and validate BA Labs website images
        run: python ecosystem/download-images.py --manifest ecosystem/images-manifest.json --output _site/ecosystem/assets

      - name: Optimize BA Labs website images
        run: python scripts/optimize-ecosystem-images.py --directory _site/ecosystem/assets --max-edge 1800 --jpeg-quality 84

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published BA Labs assets
        run: |
          set -eu
          base="https://balabs-biotech.github.io/BA-lab/ecosystem"
          verify_asset() {
            path="$1"
            expected="$2"
            for attempt in $(seq 1 18); do
              result="$(curl -sSL -o /dev/null -w '%{http_code} %{content_type}' "$base/$path" || true)"
              code="${result%% *}"
              mime="${result#* }"
              if [ "$code" = "200" ] && echo "$mime" | grep -qi "$expected"; then
                echo "✓ $path ($mime)"
                return 0
              fi
              sleep 5
            done
            echo "Published asset verification failed: $path ($result)" >&2
            return 1
          }
          verify_asset "assets/chapter-home.jpg" "image/jpeg"
          verify_asset "assets/home-hero.jpg" "image/jpeg"
          verify_asset "assets/universe-myco.jpg" "image/jpeg"
          verify_asset "assets/universe-bio.jpg" "image/jpeg"
          verify_asset "assets/universe-soil.jpg" "image/jpeg"
          verify_asset "assets/universe-products.jpg" "image/jpeg"
          verify_asset "assets/editorial-penicillium.png" "image/png"
          verify_asset "explorer-2d.js?v=radial-rings-4" "javascript"

      - name: Verify storefront publication
        run: curl --fail --silent --show-error --output /dev/null --write-out 'Storefront HTTP %{http_code} (%{content_type})\n' https://balabs-biotech.github.io/BA-lab/store/index.html

      - name: Check out repository for published storefront test
        uses: actions/checkout@v4



      - name: Set up Node.js for published storefront test
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for published storefront test
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium for published storefront test
        run: npx playwright install --with-deps chromium

      - name: Run browser regression against the published storefront
        run: node scripts/test-storefront-browser.mjs
        env:
          BALABS_STORE_URL: https://balabs-biotech.github.io/BA-lab/store/index.html

