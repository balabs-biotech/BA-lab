name: Generate CultureOps Queue Migration

on:
  push:
    branches:
      - feat/cultureops-engine-execution-queue-v1
    paths:
      - .github/workflows/generate-cultureops-queue-migration.yml

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cultureops-engine-execution-queue-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate migration filename with Supabase CLI 3.1.0
        run: npx --yes supabase@3.1.0 migration new cultureops_engine_execution_queue_v1
      - name: Commit CLI-generated migration file to the feature branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "No generated migration file found"
            exit 1
          fi
          git commit -m "chore(supabase): generate CultureOps queue migration"
          git push origin HEAD:feat/cultureops-engine-execution-queue-v1
