name: NASA POWER importer contract

on:
  pull_request:
    paths:
      - "supabase/functions/nasa-power-scheduled-import/index.ts"
      - "supabase/tests/nasa-power-scheduled-import.test.mjs"
      - ".github/workflows/nasa-power-import-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/nasa-power-scheduled-import/index.ts"
      - "supabase/tests/nasa-power-scheduled-import.test.mjs"
      - ".github/workflows/nasa-power-import-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nasa-power-import-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate NASA POWER importer security contract
        run: node supabase/tests/nasa-power-scheduled-import.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check NASA POWER Edge Function
        run: deno check supabase/functions/nasa-power-scheduled-import/index.ts
