name: OSINT NDVI data checks

on:
  pull_request:
    paths:
      - "batch-tracker/osint-ndvi.js"\n      - "batch-tracker/environmental-data.js"
      - "batch-tracker/data/osint-ndvi-transitions.json"
      - "batch-tracker/data/osint-priority-zones.csv"
      - "scripts/test-osint-ndvi.mjs"
      - ".github/workflows/osint-ndvi-check.yml"
  push:
    branches: [main]
    paths:
      - "batch-tracker/osint-ndvi.js"
      - "batch-tracker/environmental-data.js"
      - "batch-tracker/data/osint-ndvi-transitions.json"
      - "batch-tracker/data/osint-priority-zones.csv"
      - "scripts/test-osint-ndvi.mjs"
      - ".github/workflows/osint-ndvi-check.yml"

permissions:
  contents: read

jobs:
  validate-osint-ndvi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate summary, candidate CSV and JavaScript syntax
        run: node scripts/test-osint-ndvi.mjs
