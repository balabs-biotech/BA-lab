name: BA Labs storefront checks
on:
  pull_request:
    paths:
      - 'store/**'
      - 'ecosystem/index.html'
      - 'scripts/test-storefront.mjs'
      - 'scripts/test-store-order-contract.mjs'
      - 'scripts/test-store-order-notion-retry.mjs'
      - 'supabase/functions/store-order-sync/**'
      - 'supabase/migrations/*store_order_notion_retry*'
      - 'scripts/test-store-catalogue-contract.mjs'
      - 'supabase/functions/create-store-order/**'
      - 'supabase/functions/store-catalogue/**'
      - 'scripts/test-store-notion-order.mjs'
      - 'supabase/functions/store-notion-order/**'
      - '.github/workflows/storefront-checks.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run storefront regression checks
        run: |
          node scripts/test-storefront.mjs
          node scripts/test-store-order-contract.mjs
          node scripts/test-store-order-notion-retry.mjs
          node scripts/test-store-catalogue-contract.mjs
          node scripts/test-store-notion-order.mjs
