name: Sync BA Labs public image assets

on:
  push:
    branches: [main]
    paths:
      - ecosystem/images-manifest.json
      - ecosystem/download-images.py
      - .github/workflows/sync-ecosystem-assets.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: balabs-image-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image optimizer
        run: python -m pip install Pillow

      - name: Download and validate all public-site raster assets
        run: python ecosystem/download-images.py --manifest ecosystem/images-manifest.json --output ecosystem/assets

      - name: Optimize local source images
        run: python scripts/optimize-ecosystem-images.py --directory ecosystem/assets --max-edge 1800 --jpeg-quality 84

      - name: Commit the reproducible image source set
        run: |
          if git diff --quiet -- ecosystem/assets; then
            echo "All public image assets are already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ecosystem/assets/
            git commit -m "Sync optimized BA Labs public image assets"
            git push origin HEAD:main
          fi

      - name: Publish the complete site artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
