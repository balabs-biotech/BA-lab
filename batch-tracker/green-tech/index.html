<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace Green Tech BA Labs : plantes, substrats, serre, irrigation et paramètres environnementaux.">
  <meta name="theme-color" content="#0d1510">
  <title>BA Labs CultureOps — Green Tech</title>
  <link rel="stylesheet" href="../tracker.css?v=20261026-core-refresh-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="agronomy">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Green Tech…</p></main></div>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.getElementById("workspace-root").innerHTML = "<main class='container'><section class='card' role='alert'><h1>Service de données indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></section></main>";
    } else {
      window.BA_LABS_DOMAIN = "agronomy";
    fetch("../workspace.html?v=20261026-core-refresh-1")
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger l’interface commune.");
        return response.text();
      })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js?v=20261026-core-refresh-1";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js?v=20261026-core-refresh-1";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur de CultureOps n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          script.onload = () => {
            // Green Tech has its own plant registry; the biological smart-entry
            // adapter is intentionally not loaded in this workspace.
            const environmental = document.createElement("script");
            environmental.src = "../environmental-data.js?v=20261027-sentinel-fallback-fix-1";
            environmental.onerror = () => console.error("Le module de contexte environnemental n’a pas pu être chargé.");
            document.body.appendChild(environmental);
            const environmentalJobs = document.createElement("script");
            environmentalJobs.src = "../environmental-jobs-panel.js?v=20261112-job-ledger-ui-1";
            environmentalJobs.onerror = () => console.error("L’historique des traitements satellite n’a pas pu être chargé ; Green Tech reste disponible.");
            document.body.appendChild(environmentalJobs);
            const alerts = document.createElement("script");
            alerts.src = "../biological-alerts.js?v=20261110-alert-inbox-1";
            alerts.onerror = () => console.error("Le centre des alertes biologiques n’a pas pu être chargé.");
            document.body.appendChild(alerts);
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
    }
  </script>
<script src="../legal-consent.js?v=20261111-privacy-1" defer></script>
</body>
</html>
