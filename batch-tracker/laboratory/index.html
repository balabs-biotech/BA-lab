<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="Espace Laboratory BA Labs : géloses, cultures liquides, inoculation du grain, matières, protocoles et filiation des lots.">
  <title>BA Labs CultureOps — Laboratory</title>
  <link rel="stylesheet" href="../tracker.css?v=20261026-core-refresh-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="laboratory">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Laboratory…</p></main></div>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.getElementById("workspace-root").innerHTML = "<main class='container'><section class='card' role='alert'><h1>Service de données indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></section></main>";
    } else {
      window.BA_LABS_DOMAIN = "laboratory";
    fetch("../workspace.html?v=20261026-core-refresh-1")
      .then(response => { if (!response.ok) throw new Error("workspace unavailable"); return response.text(); })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js?v=20261026-core-refresh-1";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js?v=20261026-core-refresh-1";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur de CultureOps n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          script.onload = () => {
            const assisted = document.createElement("script");
            assisted.src = "../smart-entry.js?v=20261029-assisted-entry-1";
            assisted.onerror = () => console.error("Le module de saisie assistée n’a pas pu être chargé.");
            document.body.appendChild(assisted);
            const alerts = document.createElement("script");
            alerts.src = "../biological-alerts.js?v=20261110-alert-inbox-1";
            alerts.onerror = () => console.error("Le centre des alertes biologiques n’a pas pu être chargé.");
            document.body.appendChild(alerts);
            const sensorPanel = document.createElement("script");
            sensorPanel.src = "../environmental-sensor-panel.js?v=20261111-sensor-panel-1";
            sensorPanel.onerror = () => console.error("Le module d’analyse des capteurs n’a pas pu être chargé ; les autres modules restent disponibles.");
            document.body.appendChild(sensorPanel);
            const driftPolicyPanel = document.createElement("script");
            driftPolicyPanel.src = "../sensor-drift-policy-panel.js?v=20261111-drift-policy-1";
            driftPolicyPanel.onerror = () => console.error("Le module de gestion des références instrumentales n’a pas pu être chargé ; l’analyse des capteurs reste disponible.");
            document.body.appendChild(driftPolicyPanel);
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
    }
  </script>
</body>
</html>
