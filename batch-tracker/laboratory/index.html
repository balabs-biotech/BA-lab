<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11191a">
  <meta name="description" content="Espace Laboratory BA Labs : géloses, cultures liquides, inoculation du grain, matières, protocoles et filiation des lots.">
  <title>BA Labs CultureOps — Laboratory</title>
  <link rel="stylesheet" href="../tracker.css?v=20261127-scroll-offset-2">
  <link rel="stylesheet" href="../workspace-unified.css?v=20261127-entry-state-213">
  <link rel="stylesheet" href="../styles/laboratory-process-map.css?v=20261117-lab-process-map-161">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="laboratory">
  <div id="workspace-root" aria-live="polite"><main class="container workspace-entry-state"><span class="workspace-entry-indicator" aria-hidden="true"></span><p>Chargement de l’espace Laboratory…</p></main></div>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.getElementById("workspace-root").innerHTML = "<main class='container workspace-entry-state'><section class='card workspace-entry-error' role='alert'><h1>Service de données indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></section></main>";
    } else {
      window.BA_LABS_DOMAIN = "laboratory";
    fetch("../workspace.html?v=20261126-bal-json-live-catalogue-2")
      .then(response => { if (!response.ok) throw new Error("workspace unavailable"); return response.text(); })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const visualRuntime = document.createElement("script");
        visualRuntime.src = "../workspace-visuals.js?v=20261126-organic-mycelium-cover-1";
        visualRuntime.onerror = () => console.info("BA Labs: effets visuels optionnels indisponibles.");
        document.body.appendChild(visualRuntime);
        const interactionRuntime = document.createElement("script");
        interactionRuntime.src = "../workspace-interactions.js?v=20261126-module-keyboard-1";
        interactionRuntime.onerror = () => console.info("BA Labs: interactions réactives désactivées.");
        document.body.appendChild(interactionRuntime);
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js?v=20261126-bal-json-i18n-1";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js?v=20261126-bal-json-live-catalogue-2";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container workspace-entry-state'><p role='alert'>Le moteur de CultureOps n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          script.onload = () => {
            const processMap = document.createElement("script");
            processMap.src = "../laboratory-process-visuals.js?v=20261117-lab-process-map-161";
            processMap.onerror = () => console.info("BA Labs: schéma de procédé optionnel indisponible.");
            document.body.appendChild(processMap);
            const assisted = document.createElement("script");
            assisted.src = "../smart-entry.js?v=20261029-assisted-entry-1";
            assisted.onerror = () => console.error("Le module de saisie assistée n’a pas pu être chargé.");
            document.body.appendChild(assisted);
            const balJsonBridge = document.createElement("script");
            balJsonBridge.src = "../bal-json-import.js?v=20261126-bal-json-live-catalogue-2";
            balJsonBridge.onerror = () => console.error("La passerelle BAL-JSON n’a pas pu être chargée.");
            document.body.appendChild(balJsonBridge);
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
    }
  </script>
</body>
</html>
