<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace Laboratory BA Labs : géloses, cultures liquides, inoculation du grain, matières, protocoles et filiation des lots.">
  <title>BA Labs — Laboratory</title>
  <link rel="stylesheet" href="../tracker.css?v=2f580b2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="laboratory">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Laboratory…</p></main></div>
  <script>
    window.BA_LABS_DOMAIN = "laboratory";
    fetch("../workspace.html")
      .then(response => { if (!response.ok) throw new Error("workspace unavailable"); return response.text(); })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur du Batch Tracker n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
  </script>
</body>
</html>
