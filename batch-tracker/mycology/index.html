<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace Mycology BA Labs : souches, lignées, générations, observations et fructification.">
  <meta name="theme-color" content="#181411">
  <title>BA Labs CultureOps — Mycology</title>
  <link rel="stylesheet" href="../tracker.css?v=20261111-rule-management-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="../../shared/biological-rule-registry.js?v=20261111-rule-registry-1"></script>
  <script src="../../shared/biological-rule-store.js?v=20261111-rule-store-1"></script>
  <script src="../../shared/biological-rule-authoring.js?v=20261111-rule-authoring-1"></script>
  <script src="../../shared/biological-rule-resolver.js?v=20261111-rule-resolver-1"></script>
  <script src="../../shared/biological-interpreter.js?v=20261111-interpreter-1"></script>
  <script src="../../shared/biological-assessment-engine.js?v=20261111-assessment-engine-1"></script>
  <script src="../../shared/biological-context-adapter.js?v=20261111-context-adapter-1"></script>
  <script src="../../shared/biological-context-loader.js?v=20261111-context-loader-1"></script>
</head>
<body data-domain="mycology">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Mycology…</p></main></div>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.getElementById("workspace-root").innerHTML = "<main class='container'><section class='card' role='alert'><h1>Service de données indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></section></main>";
    } else {
      window.BA_LABS_DOMAIN = "mycology";
    fetch("../workspace.html?v=20261111-bal-normalizer-preview-1")
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger l’interface commune.");
        return response.text();
      })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js?v=20261111-bal-normalizer-preview-1";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js?v=20261111-biological-rule-store-guard-2";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur de CultureOps n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          script.onload = () => {
            const ruleManager = document.createElement("script");
            ruleManager.src = "../../shared/biological-rule-management-ui.js?v=20261111-rule-management-2";
            ruleManager.onerror = () => console.error("L’interface de gestion des règles biologiques n’a pas pu être chargée.");
            document.body.appendChild(ruleManager);
            const assisted = document.createElement("script");
            assisted.src = "../smart-entry.js?v=20261029-assisted-entry-1";
            assisted.onerror = () => console.error("Le module de saisie assistée n’a pas pu être chargé.");
            assisted.onload = () => {
              const loadImporter = () => {
                const importer = document.createElement("script");
                importer.src = "../bal-json-import.js?v=20261111-bal-normalizer-preview-1";
                importer.onerror = () => console.error("Le module d’import BAL-JSON n’a pas pu être chargé.");
                document.body.appendChild(importer);
              };
              const normalizer = document.createElement("script");
              normalizer.src = "../../shared/bal-normalizer.js?v=20261111-bal-normalizer-preview-1";
              normalizer.onload = loadImporter;
              normalizer.onerror = () => {
                console.error("BAL-Normalizer indisponible : l’import brut reste possible.");
                loadImporter();
              };
              document.body.appendChild(normalizer);
            };
            document.body.appendChild(assisted);
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
    }
  </script>
</body>
</html>
