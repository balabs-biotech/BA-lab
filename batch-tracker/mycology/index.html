<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace Mycology BA Labs : souches, lignées, générations, observations et fructification.">
  <meta name="theme-color" content="#11191a">
  <title>BA Labs CultureOps — Mycology</title>
  <link rel="stylesheet" href="../tracker.css?v=20261116-ba-unified-110">
  <link rel="stylesheet" href="../workspace-unified.css?v=20261117-form-fields-157">
  <link rel="stylesheet" href="../styles/mycology-activity-timeline.css?v=20261117-mycology-activity-163">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="mycology">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Mycology…</p></main></div>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.getElementById("workspace-root").innerHTML = "<main class='container'><section class='card' role='alert'><h1>Service de données indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></section></main>";
    } else {
      window.BA_LABS_DOMAIN = "mycology";
    fetch("../workspace.html?v=20261127-legacy-domain-admin-1")
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger l’interface commune.");
        return response.text();
      })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const visualRuntime = document.createElement("script");
        visualRuntime.src = "../workspace-visuals.js?v=20261117-sector-interaction-160";
        visualRuntime.onerror = () => console.info("BA Labs: effets visuels optionnels indisponibles.");
        document.body.appendChild(visualRuntime);
        const interactionRuntime = document.createElement("script");
        interactionRuntime.src = "../workspace-interactions.js?v=20261116-origin-reactive-1";
        interactionRuntime.onerror = () => console.info("BA Labs: interactions réactives désactivées.");
        document.body.appendChild(interactionRuntime);
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js?v=20261126-bal-json-i18n-1";
        i18nScript.onload = () => {
          const script = document.createElement("script");
          script.src = "../tracker.js?v=20261127-legacy-domain-admin-1";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur de CultureOps n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          script.onload = () => {
            const lineageVisuals = document.createElement("script");
            lineageVisuals.src = "../mycology-lineage-visuals.js?v=20261117-pixi-graph-controls-159";
            lineageVisuals.onerror = () => console.info("BA Labs: liste de filiation disponible sans graphe PixiJS.");
            document.body.appendChild(lineageVisuals);
            const activityTimeline = document.createElement("script");
            activityTimeline.src = "../mycology-activity-timeline.js?v=20261117-mycology-activity-163";
            activityTimeline.onerror = () => console.info("BA Labs: historique textuel disponible sans chronologie PixiJS.");
            document.body.appendChild(activityTimeline);
            const assisted = document.createElement("script");
            assisted.src = "../smart-entry.js?v=20261029-assisted-entry-1";
            assisted.onerror = () => console.error("Le module de saisie assistée n’a pas pu être chargé.");
            document.body.appendChild(assisted);
            const balJsonBridge = document.createElement("script");
            balJsonBridge.src = "../bal-json-import.js?v=20261127-legacy-domain-admin-1";
            balJsonBridge.onerror = () => console.error("La passerelle BAL-JSON n’a pas pu être chargée.");
            document.body.appendChild(balJsonBridge);
          };
          document.body.appendChild(script);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
    }
  </script>
</body>
</html>
