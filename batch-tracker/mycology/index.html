<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace Mycology BA Labs : souches, lignées, générations, observations et fructification.">
  <meta name="theme-color" content="#183b24">
  <title>BA Labs — Mycology</title>
  <link rel="stylesheet" href="../tracker.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body data-domain="mycology">
  <div id="workspace-root" aria-live="polite"><main class="container"><p>Chargement de l’espace Mycology…</p></main></div>
  <script>
    window.BA_LABS_DOMAIN = "mycology";
    fetch("../workspace.html")
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger l’interface commune.");
        return response.text();
      })
      .then(markup => {
        document.getElementById("workspace-root").innerHTML = markup;
        const i18nScript = document.createElement("script");
        i18nScript.src = "../i18n.js";
        i18nScript.onload = () => {
          const compareScript = document.createElement("script");
          compareScript.src = "../compare-analysis.js";
          compareScript.onload = () => {
            const script = document.createElement("script");
            script.src = "../tracker.js";
          script.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le moteur du Batch Tracker n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
            document.body.appendChild(script);
          };
          compareScript.onerror = () => {
            document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module d’analyse comparative n’a pas pu être chargé. Rechargez la page.</p></main>";
          };
          document.body.appendChild(compareScript);
        };
        i18nScript.onerror = () => {
          document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>Le module de langues n’a pas pu être chargé. Rechargez la page.</p></main>";
        };
        document.body.appendChild(i18nScript);
      })
      .catch(() => {
        document.getElementById("workspace-root").innerHTML = "<main class='container'><p role='alert'>L’interface n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p></main>";
      });
  </script>
</body>
</html>
