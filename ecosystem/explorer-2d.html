<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111B1D">
<meta name="description" content="Explorer le réseau vivant BA Labs en deux dimensions.">
<title>BA Labs — Explorateur 2D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.8.1/daisyui.css">
<style>
:root,[data-theme="dark"]{color-scheme:dark;--color-base-100:#111b1d;--color-base-200:#172422;--color-base-300:#263b38;--color-base-content:#d1d0c5;--color-primary:#b96b4d;--color-primary-content:#111b1d;--color-secondary:#78958a;--color-secondary-content:#111b1d;--color-accent:#a9b9a5;--color-accent-content:#111b1d;--color-neutral:#263b38;--color-neutral-content:#e4e7dd;--radius-box:1rem;--radius-field:.75rem;--radius-selector:.75rem}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b1d;color:#d1d0c5;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#1c302d 0%,#142220 48%,#101719 100%)}
.explorer{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}
.topbar{z-index:5;display:flex;align-items:center;gap:14px;min-height:62px;padding:9px clamp(12px,2.5vw,30px);border-bottom:1px solid #8ba39424;background:#111b1de8;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#e4e7dd;min-width:150px}.brand-mark{width:30px;height:30px;border:1px solid #b96b4d88;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.1em}.brand-copy{display:grid;gap:1px}.brand-copy strong{font-size:12px;letter-spacing:.2em}.brand-copy small{font-size:9px;letter-spacing:.08em;color:#8fa49a}
.crumbs{flex:1;min-width:0;overflow:hidden}.breadcrumbs{font-size:11px;color:#aebdb3}.breadcrumbs ul{flex-wrap:nowrap;white-space:nowrap;overflow:auto}.breadcrumbs li{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:7px}.lang-select{width:auto;min-height:35px;height:35px;padding-inline:9px;background:#1b2a28;border-color:#526a604d;color:#d1d0c5;font-size:11px}.actions .btn{min-height:35px;height:35px;font-size:10px}
.stage{position:relative;min-height:0;overflow:hidden}#field{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#field.dragging{cursor:grabbing}
.stage-title{position:absolute;left:clamp(14px,2.5vw,30px);top:clamp(15px,2.5vw,28px);z-index:2;pointer-events:none;max-width:min(440px,calc(100% - 150px))}
.eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#91a79a}.stage-title h1{font-size:clamp(17px,2vw,25px);font-weight:600;letter-spacing:-.04em;margin:5px 0;color:#e1e4d9}.stage-title p{font-size:11px;line-height:1.5;color:#9bada2;margin:0;max-width:390px}
.controls{position:absolute;right:clamp(12px,2.5vw,28px);top:clamp(14px,2.5vw,26px);z-index:3;display:grid;gap:6px}.controls .btn{width:38px;height:38px;min-height:38px;padding:0;font-size:17px;border-color:#7d958733;background:#172522e8;color:#d1d0c5}.controls .btn:hover{border-color:#b96b4d;background:#243630}
#selection{position:absolute;left:clamp(12px,2.5vw,28px);bottom:clamp(12px,2vw,22px);z-index:4;width:min(360px,calc(100% - 24px));max-height:38%;overflow:auto}#selection:empty{display:none}#selection .card{background:#152321ed;border:1px solid #8da49442;box-shadow:0 18px 50px #0005;backdrop-filter:blur(18px)}#selection .card-body{padding:14px;gap:8px}#selection .card-title{font-size:15px;line-height:1.25;color:#e4e5da}#selection p{font-size:11px;line-height:1.5;color:#aebbb1;margin:0}#selection .card-actions{gap:7px;flex-wrap:wrap}#selection .btn{min-height:33px;height:33px;font-size:10px;padding-inline:11px}
.breadcrumb-link{border:0;background:transparent;color:#b9c8bd;font:inherit;font-size:11px;cursor:pointer;padding:3px 5px;border-radius:5px}.breadcrumb-link:hover,.breadcrumb-link[aria-current="page"]{color:#e4e7dd;background:#263b3866}.child-branches{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow:auto;padding-top:2px;border-top:1px solid #8da49424}.child-branches .btn{max-width:100%;height:auto;min-height:27px;padding:5px 8px;line-height:1.25;text-align:left;white-space:normal;font-size:10px;color:#c3cec4}
.hint{position:absolute;right:clamp(12px,2.5vw,28px);bottom:clamp(12px,2vw,22px);z-index:2;padding:7px 10px;border:1px solid #82998a30;border-radius:999px;background:#101a1ad9;color:#8ea296;font-size:9px;letter-spacing:.05em;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:#111b1df2;color:#d1d0c5}.loading[hidden]{display:none}.loading .card{background:#172522;border:1px solid #8da49444}
.accessible-nodes{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.topbar{gap:7px;min-height:56px;padding:8px 10px}.brand{min-width:auto}.brand-copy small{display:none}.brand-mark{width:28px;height:28px}.crumbs{display:none}.actions{margin-left:auto}.actions .btn{min-height:33px;height:33px}.stage-title{top:14px;left:13px;max-width:calc(100% - 112px)}.stage-title p{font-size:10px}.controls{top:13px;right:12px}.controls .btn{width:34px;height:34px;min-height:34px}.hint{display:none}#selection{bottom:12px;left:12px;width:min(330px,calc(100% - 24px));max-height:33%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Compact eight-point universe rail: direct access without a drawer. */
.universe-rail{position:absolute;z-index:3;left:clamp(10px,1.5vw,20px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border:1px solid #8da4942c;border-radius:14px;background:rgba(17,27,29,.78);backdrop-filter:blur(12px);max-width:190px}
.universe-point{width:172px;min-height:32px;height:auto;display:block;padding:6px 9px;border:1px solid #91a79a35;border-radius:8px;background:transparent;color:#aebdb3;font:500 9px/1.25 Inter,system-ui,sans-serif;letter-spacing:0;text-align:left;white-space:normal;cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .25s}
.universe-point:hover{border-color:#b96b4d;color:#f0eee3;transform:scale(1.08)}
.universe-point.is-active{background:#263b38;border-color:#b96b4d;color:#f0eee3;box-shadow:0 0 0 3px #b96b4d20}
@media(max-width:700px){.universe-rail{left:9px;right:9px;top:auto;bottom:12px;transform:none;flex-direction:row;gap:4px;padding:5px;max-width:calc(100% - 18px);overflow-x:auto;border-radius:11px}.universe-point{width:max-content;min-width:max-content;max-width:170px;min-height:29px;padding:5px 8px;font-size:8px;line-height:1.2}#selection{left:9px;bottom:58px;width:min(300px,calc(100% - 18px))}}
</style>
</head>
<body>
<div class="explorer">
<header class="topbar navbar" aria-label="BA Labs explorer">
 <a class="brand" href="./index.html" aria-label="Retour au site BA Labs"><span class="brand-mark">BA</span><span class="brand-copy"><strong>BALABS</strong><small>APPLIED BIOTECHNOLOGY</small></span></a>
 <nav class="crumbs breadcrumbs" aria-label="Navigation du réseau"><ul id="crumbs"><li><span>BA Labs</span></li></ul></nav>
 <div class="actions">
  <select class="select select-sm lang-select" id="language" aria-label="Choisir la langue"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="ar">🇩🇿 العربية</option><option value="pt">🇵🇹 PT</option></select>
  <span class="badge badge-outline">PIXIJS · WEBGL 2D</span>
 </div>
</header>
<main class="stage">
 <canvas id="field" aria-label="Réseau mycélien continu et explorable des huit univers BA Labs"></canvas>
 <div class="stage-title"><div class="eyebrow" id="kicker">EXPLORATION / 2D</div><h1 id="heading">Un seul réseau vivant.</h1><p id="description">Zoome dans les ramifications et sélectionne chaque branche.</p></div>
 <nav class="universe-rail" id="universeRail" aria-label="Accès direct aux huit univers"></nav>
 <div class="controls" aria-label="Contrôles de la carte"><button class="btn btn-square btn-sm" id="zoomIn" aria-label="Zoom avant">+</button><button class="btn btn-square btn-sm" id="zoomOut" aria-label="Zoom arrière">−</button><button class="btn btn-square btn-sm" id="reset" aria-label="Recentrer">⌖</button><button class="btn btn-square btn-sm" id="back" aria-label="Retour" disabled>↶</button></div>
 <section id="selection" aria-live="polite"></section>
 <div class="hint" id="hint">GLISSER · PINCER POUR ZOOMER · SÉLECTIONNER UN NŒUD</div>
 <nav class="accessible-nodes" id="accessibleNodes" aria-label="Branches visibles"></nav>
 <div class="loading" id="loading"><div class="card"><div class="card-body"><span class="loading loading-spinner loading-md"></span><p>Chargement du réseau…</p></div></div></div>
</main>
</div>
<script type="importmap">
{"imports":{"pixi.js":"https://cdn.jsdelivr.net/npm/pixi.js@8.23.0/dist/pixi.min.mjs"}}
</script>
<script type="module" src="./explorer-2d.js?v=progressive-reveal-2"></script>
</body></html>
