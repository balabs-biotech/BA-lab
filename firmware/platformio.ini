; ==========================================================================
; SARL B.A. LAB — firmware PlatformIO project (single canonical location)
; Build:   cd firmware && pio run            (both nodes)
;          cd firmware && pio run -e climate_node
;          cd firmware && pio run -e irrigation_node
; Tests:   sh firmware/test/run_tests.sh      (host-side logic tests, no hardware)
; Note: library/platform versions below were NOT build-verified in the
; cleanup session (no network access). First `pio run` on a networked machine
; is the real check; pin exact versions once it passes.
; ==========================================================================

[platformio]
src_dir = src
default_envs = climate_node, irrigation_node

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Node 1 — incubation chamber climate (DHT22 + heater/humidifier/fan relays)
[env:climate_node]
build_src_filter = -<*> +<climate_node/>
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Node 2 — substrate irrigation + CO2 purge (soil moisture + SCD4x + pump/fan relays)
[env:irrigation_node]
build_src_filter = -<*> +<irrigation_node/>
lib_deps =
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
